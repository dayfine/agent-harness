# harness: reusable
name: Harness Check

on:
  pull_request:
    paths:
      - '.agents/**'
      - 'bin/agent-harness-check.sh'
      - 'bin/agent-standing-rules-check.sh'
      - 'bin/test-agent-standing-rules-check.sh'
      - 'dev/lib/chain-runner.sh'
      - 'dev/lib/wait-pr-checks.sh'
      - 'bin/test-chain-runner.sh'
      - 'bin/test-wait-pr-checks.sh'
      - 'bin/agent-harness-sync.sh'
      - 'bin/test-agent-harness-sync.sh'

jobs:
  check-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run agent-harness-check.sh
        run: sh bin/agent-harness-check.sh
      - name: Run agent-standing-rules-check.sh
        run: sh bin/agent-standing-rules-check.sh
      - name: Test agent-standing-rules-check.sh
        if: hashFiles('bin/test-agent-standing-rules-check.sh') != ''
        run: sh bin/test-agent-standing-rules-check.sh
      - name: Test chain-runner.sh
        if: hashFiles('bin/test-chain-runner.sh') != ''
        run: sh bin/test-chain-runner.sh
      - name: Test wait-pr-checks.sh
        if: hashFiles('bin/test-wait-pr-checks.sh') != ''
        run: sh bin/test-wait-pr-checks.sh
      - name: Test agent-harness-sync.sh
        if: hashFiles('bin/test-agent-harness-sync.sh') != ''
        run: sh bin/test-agent-harness-sync.sh
